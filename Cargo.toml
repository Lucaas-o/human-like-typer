[package]
name = "human-like-typer"
version = "0.2.0"
edition = "2021"
description = "Standalone human-like text typer with realistic timing, typos, and persistent settings."
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true }
enigo = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"

# Release profile optimized for smaller standalone binary size
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true